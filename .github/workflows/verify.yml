name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: "构建 NSIS 安装包并上传产物"
        type: boolean
        default: true

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push/PR runs the fast checks only; packaging is opt-in (manual
  # dispatch with the package input, or a tag) so day-to-day CI stays short.
  verify:
    name: Checks (frontend + Go)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Ticket 41: LibRaw/libheif are cgo-linked from the vcpkg manifest
      # (x64-mingw-static). The triplet needs a mingw toolchain; the binary
      # cache keeps day-to-day CI from rebuilding them.
      - name: Install MinGW toolchain
        run: choco install mingw -y --no-progress

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-mingw-static-${{ hashFiles('vcpkg.json') }}

      - name: Install LibRaw/libheif (vcpkg manifest)
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          # vcpkg.json pins a baseline commit; a shallow clone does not have
          # it, so fetch exactly that commit by SHA (GitHub allows fetching
          # reachable commits).
          BASELINE=$(python -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg.exe" install --triplet x64-mingw-static

      - name: Frontend checks (svelte-check + vitest)
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test

      - name: Go checks (vet + test)
        run: |
          go vet ./...
          go test ./...

      # 票 52：把基准数字留在 CI 日志里，作为"性能趋势"的落点。
      # -run '^$' 跳过普通测试（上一行已经跑过），只跑基准。
      # -benchtime=1x：每个基准只跑一轮，足以把 ns/op 与内存分配记进日志，又不会把
      # windows-latest 的流水线拖长。本仓库的基准（internal/render、internal/bridge）
      # 已经自己判 testing.Short()，重负载项（100MP）还要 COMPOSITOR_BENCH_HEAVY=1，
      # 所以这里不传 -short：默认参数下跑的正是可以常驻 CI 的那部分。
      # 本地实测：这条命令约 5s，4 个基准都有输出。
      - name: Benchmarks (1 iteration, log-only trend)
        run: |
          go test ./internal/... -run '^$' -bench . -benchtime=1x

      # 票 52：启动到就绪基准。这一步是"尽力而为"——GitHub 的 windows-latest runner
      # 没有交互式桌面会话，WebView2 起不来，脚本会明确报错并且不产出样本（脚本不会编造）。
      # 因此这里允许失败；真值请看 docs/benchmarks/launch.md 与 docs/benchmarks/launch.json。
      - name: Launch-to-ready benchmark (best effort; skipped/failed on headless runners — see docs/benchmarks/launch.md)
        continue-on-error: true
        run: |
          pwsh -NoProfile -File scripts/launchbench.ps1 -SkipBuild -Runs 3

  package:
    name: Build app + NSIS installer
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package || startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install MinGW toolchain
        run: choco install mingw -y --no-progress

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-mingw-static-${{ hashFiles('vcpkg.json') }}

      - name: Install LibRaw/libheif (vcpkg manifest)
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          # vcpkg.json pins a baseline commit; a shallow clone does not have
          # it, so fetch exactly that commit by SHA (GitHub allows fetching
          # reachable commits).
          BASELINE=$(python -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg.exe" install --triplet x64-mingw-static

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # wails build -nsis skips installer generation with only a warning when
      # makensis is missing, so NSIS must be installed explicitly.
      - name: Build app + NSIS installer
        run: |
          choco install nsis -y --no-progress
          "$(go env GOPATH)/bin/wails" build -nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compositor-windows
          if-no-files-found: error
          path: |
            build/bin/*.exe
