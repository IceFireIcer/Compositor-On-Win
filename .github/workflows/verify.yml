name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      package:
        description: "构建 NSIS 安装包并上传产物"
        type: boolean
        default: true

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every push/PR runs the fast checks only; packaging is opt-in (manual
  # dispatch with the package input, or a tag) so day-to-day CI stays short.
  verify:
    name: Checks (frontend + Go)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Ticket 41: LibRaw/libheif are cgo-linked from the vcpkg manifest
      # (x64-mingw-static). The triplet needs a mingw toolchain; the binary
      # cache keeps day-to-day CI from rebuilding them.
      - name: Install MinGW toolchain
        run: choco install mingw -y --no-progress

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-mingw-static-${{ hashFiles('vcpkg.json') }}

      - name: Install LibRaw/libheif (vcpkg manifest)
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          # vcpkg.json pins a baseline commit; a shallow clone does not have
          # it, so fetch exactly that commit by SHA (GitHub allows fetching
          # reachable commits).
          BASELINE=$(python -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg.exe" install --triplet x64-mingw-static

      - name: Frontend checks (svelte-check + vitest)
        working-directory: frontend
        run: |
          npm ci
          npm run check
          npm test

      - name: Go checks (vet + test)
        run: |
          go vet ./...
          go test ./...

  package:
    name: Build app + NSIS installer
    needs: verify
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package || startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install MinGW toolchain
        run: choco install mingw -y --no-progress

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/vcpkg/archives
          key: vcpkg-x64-mingw-static-${{ hashFiles('vcpkg.json') }}

      - name: Install LibRaw/libheif (vcpkg manifest)
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg "$RUNNER_TEMP/vcpkg"
          # vcpkg.json pins a baseline commit; a shallow clone does not have
          # it, so fetch exactly that commit by SHA (GitHub allows fetching
          # reachable commits).
          BASELINE=$(python -c "import json;print(json.load(open('vcpkg.json'))['builtin-baseline'])")
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 origin "$BASELINE"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.bat" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg.exe" install --triplet x64-mingw-static

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      # wails build -nsis skips installer generation with only a warning when
      # makensis is missing, so NSIS must be installed explicitly.
      - name: Build app + NSIS installer
        run: |
          choco install nsis -y --no-progress
          "$(go env GOPATH)/bin/wails" build -nsis

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compositor-windows
          if-no-files-found: error
          path: |
            build/bin/*.exe
